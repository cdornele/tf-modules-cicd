name: terraform security scans
on:
  workflow_call:

jobs:
  tfsec:
    name: Terraform Security & Best Practices (tfsec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          full_repo_scan: true
          sarif_file: 'tfsec.sarif'

      - name: upload sarif file
        uses: github/codeql-action/upload-sarif@v3
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: tfsec.sarif

      - name: Extract high/critical tfsec findings and prepare issue
        run: |
          jq -r '
            .runs[].results[]
            | select(.properties.severity == "HIGH" or .properties.severity == "CRITICAL")
            | "- **Rule:** \(.ruleId)\n  **Severity:** \(.properties.severity)\n  **Message:** \(.message.text)\n  **Location:** \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\n"
          ' tfsec.sarif > tfsec-high-critical-findings.txt

          if [ -s tfsec-high-critical-findings.txt ]; then
            echo -e "# High/Critical tfsec Findings\n\n$(cat tfsec-high-critical-findings.txt)" > tfsec_issue.txt
            echo "CREATE_ISSUE=true" >> $GITHUB_ENV
          else
            echo "No high/critical findings"
            echo "CREATE_ISSUE=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Issue for high/critical tfsec findings
        if: env.CREATE_ISSUE == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "tfsec detected High/Critical security issues"
          content-filepath: ./tfsec_issue.txt
          labels: "tfsec,security,high-priority"